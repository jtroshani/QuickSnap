name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build QuickSnap.app
        run: ./build.sh

      - name: Zip the app
        run: ditto -c -k --keepParent QuickSnap.app QuickSnap.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSnap
          path: QuickSnap.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: QuickSnap.zip
